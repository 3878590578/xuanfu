buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 明确指定 Android Gradle 插件的版本
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
